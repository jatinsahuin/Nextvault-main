# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nextvault
      POSTGRES_PASSWORD: nextvault
      POSTGRES_DB: nextvault
    ports: ["5432:5432"]
    volumes: ["nextvault_pg:/var/lib/postgresql/data"]
volumes:
  nextvault_pg:
