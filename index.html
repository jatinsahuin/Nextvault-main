<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextVault | OS for Human Knowledge</title>
    <link rel="stylesheet" href="/src/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Left Pane: Navigation -->
        <aside class="nav-pane">
            <div class="nav-logo">NextVault</div>

            <div class="nav-group">
                <div class="nav-group-label">Knowledge</div>
                <div class="nav-item active" data-view="search">
                    <span>Semantic Search</span>
                </div>
                <div class="nav-item" data-view="graph">
                    <span>Living Graph</span>
                </div>
                <div class="nav-item" data-view="sources">
                    <span>Source Vault</span>
                </div>
            </div>

            <div class="nav-group">
                <div class="nav-group-label">Intelligence</div>
                <div class="nav-item" data-view="insights">
                    <span>Overnight Insights</span>
                </div>
            </div>

            <div class="nav-group" style="margin-top: auto;">
                <div class="nav-item" data-view="settings">
                    <span>Settings</span>
                </div>
            </div>
        </aside>

        <!-- Center Pane: Focus -->
        <main class="focus-pane">
            <header class="focus-header">
                <h1 id="view-title">Semantic Search</h1>
                <p id="view-description" style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 300;">
                    Query your accumulated knowledge.
                </p>
            </header>

            <div id="main-content" class="synthesis-results">
                <!-- Dynamic content loads here -->
                <div class="result-card" style="text-align: center; color: var(--text-muted); border-style: dashed;">
                    Your knowledge is ready. Ask anything.
                </div>
            </div>

            <div class="ask-container">
                <div class="ask-input-wrapper">
                    <input type="text" id="ask-input" class="ask-input" placeholder="Ask your vault..." autocomplete="off">
                    <button id="ask-button" class="ask-button">Ask</button>
                </div>
            </div>
        </main>

        <!-- Right Pane: Context -->
        <aside class="context-pane">
            <div class="context-header">Knowledge Context</div>
            <div id="context-content">
                <div style="color: var(--text-muted); font-size: 0.8rem; text-align: center; margin-top: 2rem;">
                    Select an entity to view its connections.
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="/src/js/script.js"></script>
</body>
</html>
